name: IDP Platform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Unit Tests
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p "test_*.py"

      - name: Validate Backstage Templates
        run: |
          python src/template_validator.py backstage/

      - name: Validate Crossplane XRDs & Compositions
        run: |
          python src/crossplane_validator.py crossplane/

      - name: Validate Kubernetes Manifests Syntax
        uses: instrumenta/kubeval-action@master
        continue-on-error: true
        with:
          files: 'gitops/'

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-database-credentials
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: production/database/rds-master
        property: username
    - secretKey: password
      remoteRef:
        key: production/database/rds-master
        property: password
    - secretKey: host
      remoteRef:
        key: production/database/rds-master
        property: host

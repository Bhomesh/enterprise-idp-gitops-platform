replicaCount: 2

image:
  repository: ghcr.io/org/service
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: nginx
  annotations:
    kubernetes.io/tls-acme: "true"
  host: app.platform.corp

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

probes:
  liveness:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    httpGet:
      path: /readyz
      port: 8080
    initialDelaySeconds: 3
    periodSeconds: 5

database:
  enabled: false
  secretName: db-credentials

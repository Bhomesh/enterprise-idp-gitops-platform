apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xpostgresqlinstances.database.platform.corp
spec:
  group: database.platform.corp
  names:
    kind: XPostgreSQLInstance
    plural: xpostgresqlinstances
  claimNames:
    kind: PostgreSQLInstance
    plural: postgresqlinstances
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - storageGB
                - tier
              properties:
                storageGB:
                  type: integer
                  minimum: 10
                  maximum: 1000
                  description: Allocated disk size in gigabytes
                tier:
                  type: string
                  enum:
                    - dev
                    - standard
                    - high-performance
                  description: Sizing tier mapping to cloud instance size
                engineVersion:
                  type: string
                  default: "16.1"
                  description: PostgreSQL engine major version
            status:
              type: object
              properties:
                endpoint:
                  type: string
                ready:
                  type: boolean
